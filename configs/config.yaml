# THE place you set models & parameters. Code reads only from here. Aligned with A1 (BanglaHomeoRAG).
seed: 42
device: cuda                 # set to "cpu" if running without a GPU (Tesseract is CPU-only; neural OCR fallback wants a GPU)

# Generated artifacts are reproducible and stay under the gitignored data/interim directory.
paths:
  raw_dir: "data/raw"
  preprocessed_dir: "data/interim/preprocessed"
  ocr_dir: "data/interim/ocr"
  index_dir: "data/interim/index"

preprocess:
  median_kernel: 3
  max_skew_degrees: 7.0
  skew_step: 0.5
  border_px: 24

# Stage 1 — generative enhancement OFF: our speciality is code-switching, not degraded scans.
# We use CLASSICAL preprocessing (deskew / denoise / Sauvola) in ingest/preprocess.py instead. (A1 §5 trade-off.)
enhance:   {enabled: false, model: "none", type: "none"}

# Stage 2 — layout: separate body vs footnote/header so a dose stays with its remedy entry.
layout:    {model: "tesseract-layout", score_thr: 0.5, psm: 3}

# Stage 3 — OCR BASELINE = pretrained Tesseract 5 (Bengali), with a Bangla-capable neural fallback on low-confidence pages.
# Tesseract is the reproduced pretrained method for A2 Section 3.
ocr:
  engine: "tesseract"
  lang: "ben+eng"
  model: "tesseract:ben"
  tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  tessdata_dir: ""
  oem: 1
  body_psm: 6
  heading_psm: 7
  fallback: ""             # TODO Student 2: a Bangla-capable checkpoint (Surya / a bn TrOCR) for low-conf re-OCR
  finetune: false          # baseline first; flip to true only if measured CER forces it
  conf_threshold: 0.60     # pages below this trigger enhance_page + re-OCR, else abstain (A1)

# Stage 4 — embed: multilingual model that actually covers Bengali (NOT the English MiniLM default).
embed:     {model: "BAAI/bge-m3", dim: 1024, batch_size: 4, max_length: 512, use_fp16: true}

# Stage 4 — index: FLAT (exact) — corpus is small; scalable ANN is not our NFR (A1). chunk = one remedy entry, fallback window below.
index:     {type: "faiss:flat", chunk_tokens: 512, overlap: 64}

normalization:
  remedy_aliases:
    veratrum_album: ["ভিরেট্রাম", "ভেরাট্রাম", "veratrum album", "veratrum"]
    arsenicum_album: ["আর্সেনিকাম অ্যালবাম", "আর্সেনিক", "arsenicum album", "arsenic"]
    camphora: ["ক্যাম্ফর", "কর্পূর", "camphora", "camphor"]
    carbo_vegetabilis: ["কার্বো-ভেজ", "কার্বো ভেজ", "carbo vegetabilis", "carbo veg"]

# Stage 5 — retrieval + evidence-gated re-search (the mandatory A3 agentic behaviour) + Bangla-capable reranker.
retrieve:  {k: 10, k_step: 10, k_max: 20, weak_threshold: 0.35, rerank: true, reranker: "BAAI/bge-reranker-v2-m3"}

# Stage 6 — agent: read-only tools, every call logged; escalate_to_human is the one approval gate (A1 §7.3).
agent:     {max_steps: 6, autonomy: "read-only", budget_usd: 0.05}

rl:        {algo: "ppo", train_policy: false}            # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}                          # FastAPI + Gradio on HF Spaces (A1 §6)
